services:
  postgres:
    image: postgres:16
    container_name: tavrix_menu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tavrix_menu
      POSTGRES_PASSWORD: tavrix_menu
      POSTGRES_DB: tavrix_menu
    ports:
      - "5432:5432"
    volumes:
      - tavrix_menu_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tavrix_menu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  tavrix_menu_postgres_data:
